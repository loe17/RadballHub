name: Deploy to Netcup Webhosting 1000

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend SPA
        working-directory: ./frontend
        run: npm run build

      - name: Prepare Deployment Artifact
        run: |
          mkdir -p deploy_pkg
          # 1. Frontend SPA kopieren
          cp -r frontend/dist/* deploy_pkg/
          # 2. Backend API kopieren
          mkdir -p deploy_pkg/api
          cp -r backend/api/* deploy_pkg/api/
          # 3. .htaccess kopieren
          cp backend/.htaccess deploy_pkg/.htaccess
          # 4. Storage-Verzeichnisstruktur anlegen
          mkdir -p deploy_pkg/storage/uploads/exercises
          touch deploy_pkg/storage/uploads/exercises/.gitkeep

      - name: Deploy via FTP to Netcup Webspace
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NETCUP_FTP_HOST }}
          username: ${{ secrets.NETCUP_FTP_USER }}
          password: ${{ secrets.NETCUP_FTP_PASSWORD }}
          local-dir: ./deploy_pkg/
          server-dir: radballhub.rve1922.de/httpdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/config.local.php
            **/storage/uploads/exercises/**
